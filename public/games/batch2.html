<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay Vault — Batch 2 (Arcade & Action)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-4xl w-full bg-[#0B141A] border border-[#16232b] rounded-3xl p-6 shadow-2xl flex flex-col items-center space-y-6">
    <div class="flex items-center justify-between w-full border-b border-[#1F2C34] pb-4">
      <div>
        <h1 class="text-lg font-bold text-emerald-400">Relay Vault: Batch 2 (Games 18 - 22)</h1>
        <p class="text-xs text-slate-400">Snake Retro · Pong PvE · Flappy Bird · Breakout · Space Invaders</p>
      </div>
    </div>

    <div class="grid grid-cols-3 sm:grid-cols-5 gap-3 w-full">
      <button onclick="loadArcade(1)" class="p-3 rounded-2xl bg-[#1F2C34] hover:bg-[#2A3942] text-xs font-bold text-left border border-[#2A3942]">18. Snake Retro</button>
      <button onclick="loadArcade(2)" class="p-3 rounded-2xl bg-[#1F2C34] hover:bg-[#2A3942] text-xs font-bold text-left border border-[#2A3942]">19. Pong PvE</button>
      <button onclick="loadArcade(3)" class="p-3 rounded-2xl bg-[#1F2C34] hover:bg-[#2A3942] text-xs font-bold text-left border border-[#2A3942]">20. Flappy Bird</button>
      <button onclick="loadArcade(4)" class="p-3 rounded-2xl bg-[#1F2C34] hover:bg-[#2A3942] text-xs font-bold text-left border border-[#2A3942]">21. Breakout</button>
      <button onclick="loadArcade(5)" class="p-3 rounded-2xl bg-[#1F2C34] hover:bg-[#2A3942] text-xs font-bold text-left border border-[#2A3942]">22. Space Invaders</button>
    </div>

    <div class="relative w-full aspect-[4/3] bg-[#05070a] rounded-2xl border border-[#16232b] flex items-center justify-center p-4">
      <canvas id="canvas" width="600" height="400" class="rounded-xl bg-black border border-[#0a0a0c] w-full h-full object-contain"></canvas>
    </div>

    <div class="mt-3 flex items-center gap-3 text-xs text-slate-500 font-mono">
      <span id="score-display">High Score: --</span>
      <span class="w-px h-3 bg-slate-700"></span>
      <span id="game-name">--</span>
    </div>
  </div>

  <script>
    let loop = null;
    let currentGameId = 0;
    let currentScore = 0;

    function submitHighScore(gameId, score) {
      if (window.parent) {
        window.parent.postMessage({ type: 'ARCADE_SCORE', gameId, score }, '*');
      }
    }

    function updateScoreDisplay(gameId, score) {
      document.getElementById('score-display').textContent = `High Score: ${score}`;
      document.getElementById('game-name').textContent = `Game #${gameId}`;
    }

    function loadArcade(id) {
      if (loop) clearInterval(loop);
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      currentGameId = id + 17; // Batch 2 starts at game 18
      currentScore = 0;
      updateScoreDisplay(currentGameId, 0);
      if (id === 1) runSnake(canvas, ctx);
      else if (id === 2) runPong(canvas, ctx);
      else if (id === 3) runFlappy(canvas, ctx);
      else if (id === 4) runBreakout(canvas, ctx);
      else if (id === 5) runInvaders(canvas, ctx);
    }

    function runSnake(canvas, ctx) {
      let score = 0, snake = [{x:10, y:10}], food = {x:15, y:15}, dx = 1, dy = 0, size = 20;
      window.onkeydown = (e) => {
        if(e.key==="ArrowUp"&&dy===0){dx=0;dy=-1;}
        if(e.key==="ArrowDown"&&dy===0){dx=0;dy=1;}
        if(e.key==="ArrowLeft"&&dx===0){dx=-1;dy=0;}
        if(e.key==="ArrowRight"&&dx===0){dx=1;dy=0;}
      };
      loop = setInterval(() => {
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};
        if(head.x<0) head.x = 29; if(head.x>=30) head.x = 0;
        if(head.y<0) head.y = 19; if(head.y>=20) head.y = 0;
        if(snake.some(s => s.x === head.x && s.y === head.y)) {
          currentScore = Math.max(currentScore, score);
          updateScoreDisplay(currentGameId, currentScore);
          submitHighScore(currentGameId, currentScore);
          snake = [{x:10, y:10}]; score = 0; dx = 1; dy = 0;
          return;
        }
        snake.unshift(head);
        if(head.x === food.x && head.y === food.y) {
          score += 10; food = {x: Math.floor(Math.random()*30), y: Math.floor(Math.random()*20)};
        } else { snake.pop(); }
        ctx.fillStyle="#020617"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#f43f5e"; ctx.fillRect(food.x*size, food.y*size, size-2, size-2);
        snake.forEach((p,i)=>{ctx.fillStyle=i===0?"#34d399":"#10b981"; ctx.fillRect(p.x*size, p.y*size, size-2, size-2);});
        ctx.fillStyle="#fff"; ctx.font="14px monospace"; ctx.fillText(`SCORE: ${score}`, 15, 25);
      }, 90);
    }

    function runPong(canvas, ctx) {
      let p1 = 150, p2 = 150, bx = 300, by = 200, vx = 4, vy = 3, score = 0;
      window.onkeydown = (e) => {
        if(e.key==="ArrowUp") p1 = Math.max(0, p1-20);
        if(e.key==="ArrowDown") p1 = Math.min(canvas.height-70, p1+20);
      };
      loop = setInterval(() => {
        bx += vx; by += vy;
        if(by<=0 || by>=canvas.height-10) vy = -vy;
        if(by > p2+35) p2 += 2.5; else p2 -= 2.5;
        if(bx<=20 && by>=p1 && by<=p1+70) { vx = -vx; score += 10; currentScore = Math.max(currentScore, score); updateScoreDisplay(currentGameId, currentScore); submitHighScore(currentGameId, currentScore); }
        if(bx>=canvas.width-30 && by>=p2 && by<=p2+70) vx = -vx;
        if(bx<0 || bx>canvas.width) { bx=300; by=200; score=0; }
        ctx.fillStyle="#020617"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#10b981"; ctx.fillRect(10,p1,10,70); ctx.fillRect(canvas.width-20,p2,10,70);
        ctx.fillStyle="#38bdf8"; ctx.fillRect(bx,by,10,10);
        ctx.fillStyle="#fff"; ctx.font="14px monospace"; ctx.fillText(`SCORE: ${score}`, 15, 25);
      }, 1000/60);
    }

    function runFlappy(canvas, ctx) {
      let by = 200, vy = 0, score = 0, pipes = [{x:500, top:120}];
      window.onkeydown = () => vy = -6; canvas.onclick = () => vy = -6;
      loop = setInterval(() => {
        by += vy; vy += 0.35;
        if(by > canvas.height - 20 || by < 0) {
          currentScore = Math.max(currentScore, score);
          updateScoreDisplay(currentGameId, currentScore);
          submitHighScore(currentGameId, currentScore);
          by = 200; vy = 0; score = 0; pipes = [{x:500, top:120}];
        }
        ctx.fillStyle="#020617"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#fbbf24"; ctx.fillRect(100,by,20,20);
        pipes.forEach(p => {
          p.x -= 3;
          ctx.fillStyle="#10b981"; ctx.fillRect(p.x,0,40,p.top); ctx.fillRect(p.x,p.top+130,40,canvas.height);
          if(p.x===100) score++;
        });
        if(pipes[0].x<-40) pipes.shift();
        if(pipes.length<2) pipes.push({x:600, top:Math.random()*150+50});
        ctx.fillStyle="#fff"; ctx.font="14px monospace"; ctx.fillText(`SCORE: ${score}`, 20, 30);
      }, 1000/60);
    }

    function runBreakout(canvas, ctx) {
      let px=250, bx=300, by=250, vx=3, vy=-3, score = 0;
      window.onmousemove = (e) => { px = e.offsetX - 40; };
      loop = setInterval(() => {
        bx += vx; by += vy;
        if(bx<=0 || bx>=canvas.width) vx = -vx;
        if(by<=0) vy = -vy;
        if(by>=canvas.height-20 && bx>=px && bx<=px+80) { vy = -vy; score += 10; currentScore = Math.max(currentScore, score); updateScoreDisplay(currentGameId, currentScore); submitHighScore(currentGameId, currentScore); }
        if(by>canvas.height) { bx=300; by=250; score=0; }
        ctx.fillStyle="#020617"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#38bdf8"; ctx.fillRect(px, canvas.height-20, 80, 10);
        ctx.fillStyle="#f43f5e"; ctx.beginPath(); ctx.arc(bx, by, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle="#fff"; ctx.font="14px monospace"; ctx.fillText(`SCORE: ${score}`, 15, 25);
      }, 1000/60);
    }

    function runInvaders(canvas, ctx) {
      let sx=280, bullets=[], score = 0;
      window.onkeydown = (e) => {
        if(e.key==="ArrowLeft") sx = Math.max(10, sx-20);
        if(e.key==="ArrowRight") sx = Math.min(canvas.width-40, sx+20);
        if(e.key===" ") bullets.push({x:sx+15, y:canvas.height-30});
      };
      loop = setInterval(() => {
        ctx.fillStyle="#020617"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#10b981"; ctx.fillRect(sx, canvas.height-20, 30, 10);
        bullets.forEach((b,i)=>{ b.y -= 6; ctx.fillStyle="#fbbf24"; ctx.fillRect(b.x, b.y, 4, 10); if(b.y < 0) { bullets.splice(i,1); score += 5; currentScore = Math.max(currentScore, score); updateScoreDisplay(currentGameId, currentScore); submitHighScore(currentGameId, currentScore); } });
        ctx.fillStyle="#fff"; ctx.font="14px monospace"; ctx.fillText(`SCORE: ${score}`, 15, 25);
      }, 1000/60);
    }
  </script>
</body>
</html>
