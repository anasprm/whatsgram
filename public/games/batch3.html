<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relay Vault — Batch 3 (Sports, Simulation & Adventure)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-4xl w-full bg-[#0B141A] border border-[#16232b] rounded-3xl p-6 shadow-2xl flex flex-col items-center space-y-6">
    <div class="flex items-center justify-between w-full border-b border-[#1F2C34] pb-4">
      <div>
        <h1 class="text-lg font-bold text-emerald-400">Relay Vault: Batch 3 (Games 35 - 38)</h1>
        <p class="text-xs text-slate-400">Billiards 8-Ball · Air Hockey · Basketball · Zelda Dungeon</p>
      </div>
    </div>

    <div class="grid grid-cols-3 sm:grid-cols-4 gap-3 w-full">
      <button onclick="loadSim(1)" class="p-3 rounded-2xl bg-[#1F2C34] hover:bg-[#2A3942] text-xs font-bold text-left border border-[#2A3942]">35. Billiards 8-Ball</button>
      <button onclick="loadSim(2)" class="p-3 rounded-2xl bg-[#1F2C34] hover:bg-[#2A3942] text-xs font-bold text-left border border-[#2A3942]">36. Air Hockey</button>
      <button onclick="loadSim(3)" class="p-3 rounded-2xl bg-[#1F2C34] hover:bg-[#2A3942] text-xs font-bold text-left border border-[#2A3942]">37. Basketball</button>
      <button onclick="loadSim(4)" class="p-3 rounded-2xl bg-[#1F2C34] hover:bg-[#2A3942] text-xs font-bold text-left border border-[#2A3942]">38. Zelda Dungeon</button>
    </div>

    <div class="relative w-full aspect-[4/3] bg-[#05070a] rounded-2xl border border-[#16232b] flex items-center justify-center p-4">
      <canvas id="canvas" width="600" height="400" class="rounded-xl bg-[#05070a] border border-[#0a0a0c] w-full h-full object-contain"></canvas>
    </div>

    <div class="mt-3 flex items-center gap-3 text-xs text-slate-500 font-mono">
      <span id="score-display">High Score: --</span>
      <span class="w-px h-3 bg-slate-700"></span>
      <span id="game-name">--</span>
    </div>
  </div>

  <script>
    let interval = null;
    let currentGameId = 0;
    let currentScore = 0;

    function submitHighScore(gameId, score) {
      if (window.parent) {
        window.parent.postMessage({ type: 'ARCADE_SCORE', gameId, score }, '*');
      }
    }

    function updateScoreDisplay(gameId, score) {
      document.getElementById('score-display').textContent = `High Score: ${score}`;
      document.getElementById('game-name').textContent = `Game #${gameId}`;
    }

    function loadSim(id) {
      if (interval) clearInterval(interval);
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      currentGameId = id + 34; // Batch 3 starts at game 35
      currentScore = 0;
      updateScoreDisplay(currentGameId, 0);
      if (id === 1) runBilliards(canvas, ctx);
      else if (id === 2) runAirHockey(canvas, ctx);
      else if (id === 3) runBasketball(canvas, ctx);
      else if (id === 4) runZelda(canvas, ctx);
    }

    function runBilliards(canvas, ctx) {
      let bx = 150, by = 200, vx = 2, vy = 1, score = 0;
      interval = setInterval(() => {
        bx += vx; by += vy;
        if(bx<=20 || bx>=canvas.width-20) vx = -vx;
        if(by<=20 || by>=canvas.height-20) vy = -vy;
        ctx.fillStyle="#064e3b"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#ffffff"; ctx.beginPath(); ctx.arc(bx, by, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle="#fff"; ctx.font="14px monospace"; ctx.fillText("Billiards 8-Ball Physics Engine", 150, 30);
        ctx.fillStyle="#fff"; ctx.font="14px monospace"; ctx.fillText(`Score: ${score}`, 20, 50);
        score += 0.1;
        if(Math.floor(score * 10) % 50 === 0) {
          currentScore = Math.floor(score);
          updateScoreDisplay(currentGameId, currentScore);
          submitHighScore(currentGameId, currentScore);
        }
      }, 1000/60);
    }

    function runAirHockey(canvas, ctx) {
      let px = 300, py = 350, puckX = 300, puckY = 200, pvx = 2, pvy = -2, score = 0;
      canvas.onmousemove = (e) => { px = e.clientX - canvas.getBoundingClientRect().left; py = e.clientY - canvas.getBoundingClientRect().top; };
      interval = setInterval(() => {
        puckX += pvx; puckY += pvy;
        if(puckX<=15 || puckX>=canvas.width-15) pvx = -pvx;
        if(puckY<=15) pvy = -pvy;
        if(puckY>=canvas.height-15) { pvy = -pvy; score += 10; currentScore = Math.max(currentScore, score); updateScoreDisplay(currentGameId, currentScore); submitHighScore(currentGameId, currentScore); }
        ctx.fillStyle="#0f172a"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle="#334155"; ctx.lineWidth=4; ctx.strokeRect(10,10,canvas.width-20,canvas.height-20);
        ctx.fillStyle="#f43f5e"; ctx.beginPath(); ctx.arc(puckX, puckY, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle="#38bdf8"; ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle="#fff"; ctx.font="14px monospace"; ctx.fillText(`Score: ${score}`, 20, 30);
      }, 1000/60);
    }

    function runBasketball(canvas, ctx) {
      let bx = 100, by = 300, vx = 5, vy = -8, score = 0, shots = 0;
      canvas.onclick = () => { if(by >= 350) { bx = 100; by = 300; vx = 5; vy = -8; shots++; } };
      interval = setInterval(() => {
        bx += vx; by += vy; vy += 0.4;
        if(by >= 350) {
          if(bx > 430 && bx < 470 && by >= 350) { score += 10; currentScore = Math.max(currentScore, score); updateScoreDisplay(currentGameId, currentScore); submitHighScore(currentGameId, currentScore); }
          bx = 100; by = 300; vx = 5; vy = -8;
        }
        ctx.fillStyle="#020617"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#f97316"; ctx.beginPath(); ctx.arc(bx, by, 12, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle="#fbbf24"; ctx.fillRect(450, 150, 10, 80);
        ctx.fillStyle="#fff"; ctx.font="14px monospace"; ctx.fillText(`Score: ${score} | Shots: ${shots}/10`, 20, 30);
        if(shots >= 10) clearInterval(interval);
      }, 1000/60);
    }

    function runZelda(canvas, ctx) {
      let kx = 280, ky = 180, score = 0;
      window.onkeydown = (e) => {
        if(e.key==="ArrowUp") ky -= 10;
        if(e.key==="ArrowDown") ky += 10;
        if(e.key==="ArrowLeft") kx -= 10;
        if(e.key==="ArrowRight") kx += 10;
      };
      interval = setInterval(() => {
        ctx.fillStyle="#1e293b"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle="#38bdf8"; ctx.fillRect(kx, ky, 24, 24);
        ctx.fillStyle="#f43f5e"; ctx.fillRect(400, 200, 20, 20);
        ctx.fillStyle="#fff"; ctx.font="12px monospace"; ctx.fillText("Zelda Dungeon Quest Engine (Arrow Keys to Move)", 20, 30);
        ctx.fillStyle="#fff"; ctx.font="12px monospace"; ctx.fillText(`Treasure: ${score}`, 20, 50);
        if(kx > 390 && kx < 420 && ky > 190 && ky < 230) { score += 50; currentScore = Math.max(currentScore, score); updateScoreDisplay(currentGameId, currentScore); submitHighScore(currentGameId, currentScore); kx = 280; ky = 180; }
      }, 1000/60);
    }
  </script>
</body>
</html>
